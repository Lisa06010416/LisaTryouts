[project]
name = "multi-agent-function-calling"
version = "0.1.0"
description = "Multi-agent system experiment with ChatGPT API function calling"
authors = [{name = "Lisa"}]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.1.0",
    "langsmith>=0.1.0"
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"